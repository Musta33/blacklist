<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول لمكتب التأجير | منظومة حظر مستأجري السيارات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-16 h-16 bg-gradient-to-tr from-amber-600 to-rose-600 rounded-2xl mx-auto flex items-center justify-center text-3xl shadow-lg shadow-rose-900/40">
        🚗
      </div>
      <h1 className="text-2xl font-black text-white">تسجيل الدخول لمكتب التأجير</h1>
      <p class="text-xs text-slate-400">منظومة حظر مستأجري السيارات الموحدة للمكاتب والشركات</p>
    </div>

    <div id="alertBox" class="hidden p-3.5 rounded-xl text-xs font-bold"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">البريد الإلكتروني للمكتب</label>
        <input type="email" id="email" required placeholder="office@carrental.sa"
          class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-rose-500">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">كلمة المرور</label>
        <input type="password" id="password" required placeholder="••••••••"
          class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-rose-500">
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-3.5 bg-gradient-to-r from-rose-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 text-white font-bold rounded-xl shadow-lg shadow-rose-900/30 transition">
        دخول لمكتب التأجير
      </button>
    </form>

    <div class="border-t border-slate-800 pt-4 text-center text-xs text-slate-400">
      مكتب جديد؟ <a href="/signup.html" class="text-rose-400 font-bold hover:underline">إنشاء حساب مكتب جديد</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');
      
      alertBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerText = 'جاري التحقق...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('tb_token', data.token);
          window.location.href = '/dashboard.html';
        } else if (res.status === 403 && data.status === 'Pending') {
          window.location.href = '/waiting.html';
        } else {
          alertBox.innerText = data.message || 'بيانات الدخول غير صحيحة';
          alertBox.className = 'p-3.5 rounded-xl text-xs font-bold bg-rose-500/10 text-rose-400 border border-rose-500/30';
          alertBox.classList.remove('hidden');
        }
      } catch (err) {
        alertBox.innerText = 'حدث خطأ في الاتصال بالخادم';
        alertBox.className = 'p-3.5 rounded-xl text-xs font-bold bg-rose-500/10 text-rose-400 border border-rose-500/30';
        alertBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'دخول لمكتب التأجير';
      }
    });
  </script>
</body>
</html>
